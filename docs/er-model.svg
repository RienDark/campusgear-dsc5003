<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><style>text{font-family:'Segoe UI',sans-serif;fill:#172b42}rect{fill:#fff;stroke:#172b42;stroke-width:1.7}.head{fill:#e8eff1}.title{font-size:18px;font-weight:700}.field{font-size:15px}.edge{fill:none;stroke:#546b7e;stroke-width:1.8}.card{font-size:14px;fill:#075e63;font-weight:700}</style><rect width="1080" height="640" fill="#f8f8f4" stroke="none"/><text x="28" y="32" font-size="22" font-weight="700">CampusGear / logical ER model</text><text x="28" y="57" font-size="14">Each label gives the number of rows at that end. PK = primary key · FK = foreign key · UQ = unique.</text><g class="edge"><path d="M210 180H280"/><path d="M470 180H490V300H550"/><path d="M210 435H280"/><path d="M470 435H490V360H550"/><path d="M760 290H835"/><path d="M760 375H800V510H835"/></g><g><rect x="30" y="110" width="180" height="128"/><rect class="head" x="30" y="110" width="180" height="34"/><text class="title" x="42" y="133">departments</text><text class="field" x="42" y="167">PK id</text><text class="field" x="42" y="193">UQ name</text><rect x="280" y="110" width="190" height="155"/><rect class="head" x="280" y="110" width="190" height="34"/><text class="title" x="292" y="133">members</text><text class="field" x="292" y="167">PK id · name</text><text class="field" x="292" y="193">UQ email</text><text class="field" x="292" y="219">FK department_id</text><rect x="30" y="365" width="180" height="128"/><rect class="head" x="30" y="365" width="180" height="34"/><text class="title" x="42" y="388">categories</text><text class="field" x="42" y="422">PK id</text><text class="field" x="42" y="448">UQ name</text><rect x="280" y="350" width="190" height="196"/><rect class="head" x="280" y="350" width="190" height="34"/><text class="title" x="292" y="373">equipment</text><text class="field" x="292" y="406">PK id · UQ asset_tag</text><text class="field" x="292" y="432">name · location</text><text class="field" x="292" y="458">FK category_id</text><text class="field" x="292" y="484">status</text><rect x="550" y="220" width="210" height="230"/><rect class="head" x="550" y="220" width="210" height="34"/><text class="title" x="562" y="243">reservations</text><text class="field" x="562" y="278">PK id · FK member_id</text><text class="field" x="562" y="305">FK equipment_id</text><text class="field" x="562" y="332">start_at · end_at</text><text class="field" x="562" y="359">purpose · status</text><text class="field" x="562" y="386">created_at</text><text class="field" x="562" y="424">Active overlap forbidden</text><rect x="835" y="220" width="215" height="170"/><rect class="head" x="835" y="220" width="215" height="34"/><text class="title" x="847" y="243">loans</text><text class="field" x="847" y="278">PK id</text><text class="field" x="847" y="305">FK, UQ reservation_id</text><text class="field" x="847" y="332">checked_out_at</text><text class="field" x="847" y="359">returned_at (nullable)</text><rect x="835" y="450" width="215" height="145"/><rect class="head" x="835" y="450" width="215" height="34"/><text class="title" x="847" y="473">audit_log</text><text class="field" x="847" y="507">PK id · FK reservation_id</text><text class="field" x="847" y="534">action · created_at</text></g><g class="card"><text x="219" y="168">1</text><text x="238" y="199">0..N</text><text x="477" y="169">1</text><text x="516" y="288">0..N</text><text x="219" y="423">1</text><text x="238" y="455">0..N</text><text x="478" y="423">1</text><text x="514" y="382">0..N</text><text x="770" y="278">1</text><text x="792" y="312">0..1</text><text x="770" y="363">1</text><text x="802" y="498">0..N</text></g><text x="28" y="622" font-size="14">All FK relationships shown are mandatory on the child side. Loan existence and status transitions are workflow rules.</text></svg>